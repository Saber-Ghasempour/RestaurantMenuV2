apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-menu-api
  namespace: DEPLOYMENT_NAMESPACE
  labels:
    app.kubernetes.io/name: restaurant-menu-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: restaurant-menu-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: restaurant-menu-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: IMAGE_REFERENCE
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: HttpsRedirection__Enabled
              value: "false"
            - name: Database__ApplyMigrations
              value: "false"
          envFrom:
            - secretRef:
                name: restaurant-menu-runtime
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: restaurant-menu-api
  namespace: DEPLOYMENT_NAMESPACE
spec:
  selector:
    app.kubernetes.io/name: restaurant-menu-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: restaurant-menu-api
  namespace: DEPLOYMENT_NAMESPACE
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: restaurant-menu-api
