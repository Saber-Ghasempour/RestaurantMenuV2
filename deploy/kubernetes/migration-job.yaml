apiVersion: batch/v1
kind: Job
metadata:
  name: restaurant-menu-migrate
  namespace: DEPLOYMENT_NAMESPACE
  labels:
    app.kubernetes.io/name: restaurant-menu-migrate
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: restaurant-menu-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: IMAGE_REFERENCE
          imagePullPolicy: IfNotPresent
          args:
            - --migrate
          env:
            - name: Database__ApplyMigrations
              value: "false"
          envFrom:
            - secretRef:
                name: restaurant-menu-runtime
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir: {}
