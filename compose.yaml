name: restaurantmenu

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Restaurants: Host=postgres;Port=5432;Database=restaurantmenu;Username=postgres;Password=${POSTGRES_PASSWORD:-restaurantmenu_dev}
      ConnectionStrings__Catalog: Host=postgres;Port=5432;Database=restaurantmenu;Username=postgres;Password=${POSTGRES_PASSWORD:-restaurantmenu_dev}
      ConnectionStrings__Media: Host=postgres;Port=5432;Database=restaurantmenu;Username=postgres;Password=${POSTGRES_PASSWORD:-restaurantmenu_dev}
      ConnectionStrings__Ordering: Host=postgres;Port=5432;Database=restaurantmenu;Username=postgres;Password=${POSTGRES_PASSWORD:-restaurantmenu_dev}
      ConnectionStrings__Payments: Host=postgres;Port=5432;Database=restaurantmenu;Username=postgres;Password=${POSTGRES_PASSWORD:-restaurantmenu_dev}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      ConnectionStrings__RabbitMq: amqp://restaurantmenu:${RABBITMQ_PASSWORD:-restaurantmenu_dev}@rabbitmq:5672/
      Database__ApplyMigrations: "true"
      HttpsRedirection__Enabled: "false"
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      Authentication__MetadataAddress: http://keycloak:8080/realms/restaurant-menu/.well-known/openid-configuration
      Authentication__ValidIssuer: http://localhost:${KEYCLOAK_PORT:-8081}/realms/restaurant-menu
      Authentication__Audience: restaurant-menu-api
      Authentication__RequireHttpsMetadata: "false"
      KeycloakAdmin__BaseUrl: http://keycloak:8080/
      KeycloakAdmin__Realm: restaurant-menu
      KeycloakAdmin__ClientId: ${KEYCLOAK_PROVISIONING_CLIENT_ID:-}
      KeycloakAdmin__ClientSecret: ${KEYCLOAK_PROVISIONING_CLIENT_SECRET:-}
      ObjectStorage__BucketName: restaurant-menu-media
      ObjectStorage__ServiceUrl: http://minio:9000
      ObjectStorage__PublicServiceUrl: http://localhost:${MINIO_PORT:-9000}
      ObjectStorage__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      ObjectStorage__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
      keycloak:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change_me}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KEYCLOAK_DEMO_PASSWORD: ${KEYCLOAK_DEMO_PASSWORD:-change_me}
      RESTAURANT_MENU_SERVICE_SECRET: ${RESTAURANT_MENU_SERVICE_SECRET:-restaurant-menu-local-secret}
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./deploy/keycloak/restaurant-menu-realm.json:/opt/keycloak/data/import/restaurant-menu-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: restaurantmenu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restaurantmenu_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurantmenu"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.10.1-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: restaurantmenu
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-restaurantmenu_dev}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-create-bucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} && mc mb --ignore-existing local/restaurant-menu-media"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_HEALTH_PORT:-13133}:13133"
    depends_on:
      - loki
      - tempo
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.4
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./deploy/observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.7
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.12.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./deploy/observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - otel-collector
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-restaurantmenu_dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - loki
      - tempo
      - prometheus
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  rabbitmq-data:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:
