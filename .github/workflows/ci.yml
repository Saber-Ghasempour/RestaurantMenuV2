name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-and-test:
    name: Build, test, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore RestaurantMenu.slnx

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build RestaurantMenu.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: >-
          dotnet test RestaurantMenu.slnx
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFilePrefix=test-results"
          --collect "XPlat Code Coverage"
          --results-directory "${{ github.workspace }}/TestResults"

      - name: Create coverage report
        run: >-
          dotnet tool run reportgenerator
          -reports:"TestResults/**/coverage.cobertura.xml"
          -targetdir:"CoverageReport"
          -reporttypes:"Html;Cobertura;MarkdownSummaryGithub"
          -assemblyfilters:"-*.Tests;-*.UnitTests;-*.IntegrationTests;-*.FunctionalTests"
          -filefilters:"-**/obj/**"
          --minimumCoverageThresholds:lineCoverage=80

      - name: Publish coverage summary
        run: cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: CoverageReport/
          if-no-files-found: error
          retention-days: 14

  container:
    name: Build container image
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build API image
        run: docker build --tag restaurant-menu:${{ github.sha }} .
